<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mengarahkan...</title>
  <meta name="robots" content="noindex, nofollow">
  <script>
    (function () {
      const urls = [
        "https://s.shopee.co.id/6fgfD1qnbw",
        "https://s.shopee.co.id/AUtNm852IA",
        "https://s.shopee.co.id/AUtNm8iQYg",
        "https://s.shopee.co.id/2BEFqpg8BM",
        "https://s.shopee.co.id/2qTwe4BYN3",
        "https://s.shopee.co.id/7pscbHAC9A",
        "https://s.shopee.co.id/1VyZ3f2YvB",
        "https://s.shopee.co.id/5LBHciRUuH"
      ];
      const target = urls[Math.floor(Math.random() * urls.length)];
      window.location.replace(target);
    })();
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc;
      color: #334155;
      padding: 1.5rem;
      text-align: center;
    }
    .container {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 2rem 1.5rem;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e2e8f0;
      border-top-color: #ee4d2d;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.25rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #0f172a;
    }
    .desc {
      font-size: 0.875rem;
      color: #64748b;
      line-height: 1.5;
    }
    .desc a {
      color: #ee4d2d;
      text-decoration: underline;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <p class="title">Sedang mengalihkan...</p>
    <p class="desc">
      Mohon tunggu sebentar. Jika Anda tidak dialihkan secara otomatis, 
      <a id="manual-link" href="https://s.shopee.co.id/6fgfD1qnbw" rel="noopener noreferrer">klik di sini</a>.
    </p>
  </div>
  <script>
    (function () {
      const urls = [
        "https://s.shopee.co.id/6fgfD1qnbw",
        "https://s.shopee.co.id/AUtNm852IA",
        "https://s.shopee.co.id/AUtNm8iQYg",
        "https://s.shopee.co.id/2BEFqpg8BM",
        "https://s.shopee.co.id/2qTwe4BYN3",
        "https://s.shopee.co.id/7pscbHAC9A",
        "https://s.shopee.co.id/1VyZ3f2YvB",
        "https://s.shopee.co.id/5LBHciRUuH"
      ];
      const target = urls[Math.floor(Math.random() * urls.length)];
      const link = document.getElementById("manual-link");
      if (link) {
        link.href = target;
      }
      window.location.replace(target);
    })();
  </script>
</body>
</html>
